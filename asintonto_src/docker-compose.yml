services:
  db:
    image: postgres:15-alpine
    container_name: db-asistonto
    restart: unless-stopped
    environment:
      POSTGRES_USER: 'admin'
      POSTGRES_PASSWORD: 'admin123'
      POSTGRES_DB: 'asistonto'
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - db-asistonto-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-asistonto
    restart: unless-stopped
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis-asistonto-data:/data

  minio:
    image: chainguard/minio:latest
    container_name: minio-asistonto
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: "65532:65532"
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "admin123"
    volumes:
      - minio-asistonto-data:/data

volumes:
  db-asistonto-data:
  redis-asistonto-data:
  minio-asistonto-data:
